<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador EAN-13 KRETZ — prueba</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; font-size: 14px; padding: 16px; max-width: 660px; margin: 0 auto; }

    .warning-header {
      background: #ffe000;
      color: #000;
      padding: 10px 14px;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 20px;
      border: 2px solid #cc9900;
      border-radius: 3px;
    }

    label { display: block; margin-top: 14px; margin-bottom: 4px; font-weight: bold; }

    select, input[type="text"] {
      width: 100%;
      padding: 7px 9px;
      font-size: 14px;
      border: 1px solid #bbb;
      border-radius: 3px;
    }

    #priceRef { margin-top: 8px; color: #444; font-style: italic; }

    .btn-row { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }

    button {
      padding: 10px 18px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    #btnGenerar { background: #0066cc; color: #fff; border: none; }
    #btnGenerar:hover { background: #0055aa; }

    #btnImprimir {
      background: #f0f0f0;
      color: #333;
      border: 1px solid #999;
      display: none;
    }

    #errorMsg { color: #c00; font-weight: bold; margin-top: 10px; min-height: 20px; }

    #result {
      margin-top: 24px;
      border-top: 2px solid #ddd;
      padding-top: 16px;
      display: none;
    }

    #barcodeContainer { text-align: center; margin: 8px 0; overflow-x: auto; }
    #barcodeContainer svg { max-width: 100%; height: auto; }

    #barcodeDigits {
      font-family: monospace;
      font-size: 22px;
      text-align: center;
      margin: 10px 0;
      letter-spacing: 3px;
    }

    #barcodeInfo {
      font-family: monospace;
      font-size: 13px;
      background: #f4f4f4;
      border: 1px solid #ddd;
      padding: 10px 14px;
      line-height: 1.8;
      border-radius: 3px;
    }

    @media print {
      body > * { display: none !important; }

      #result {
        display: block !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      #barcodeContainer {
        display: block !important;
        text-align: center !important;
        overflow: visible !important;
      }

      /* Scale SVG to fill the printed page */
      #barcodeContainer svg {
        width: 90vw !important;
        max-width: 600px !important;
        height: auto !important;
      }

      #barcodeDigits {
        display: block !important;
        font-family: monospace !important;
        font-size: 24px !important;
        text-align: center !important;
        letter-spacing: 3px !important;
        margin: 10px 0 !important;
      }

      #barcodeInfo { display: none !important; }
    }
  </style>
</head>
<body>

<div class="warning-header">⚠️ HERRAMIENTA DE PRUEBA — NO ES PARTE DEL POS</div>

<label for="productSelect">Producto:</label>
<select id="productSelect" onchange="onProductChange()">
  <option value="">— Seleccioná un producto —</option>
</select>

<div id="amountRow">
  <label id="amountLabel" for="amountInput">Peso (kg):</label>

  const bySection = {};

    bySection[p.section].push(p);

    }
    sel.appendChild(grp);
  }

// ─── EAN-13 encoder ───────────────────────────────────────────────────────────

function computeCheck(twelve) {
  var sum = 0;
  for (var i = 0; i < 12; i++) {
    sum += i % 2 === 0 ? +twelve[i] : +twelve[i] * 3;
  }
  return (10 - (sum % 10)) % 10;
}

function buildEAN13(plu, totalCents) {
  var pluStr   = String(plu).padStart(3, '0');
  var centsStr = String(totalCents).padStart(7, '0');
  var twelve   = '20' + pluStr + centsStr;
  var check    = computeCheck(twelve);
  return twelve + check;
}

// ─── SVG EAN-13 renderer ──────────────────────────────────────────────────────

var L_ENC = [
  '0001101','0011001','0010011','0111101','0100011',
  '0110001','0101111','0111011','0110111','0001011'
];
var G_ENC = [
  '0100111','0110011','0011011','0100001','0011101',
  '0111001','0000101','0010001','0001001','0010111'
];
var R_ENC = [
  '1110010','1100110','1101100','1000010','1011100',
  '1001110','1010000','1000100','1001000','1110100'
];
// Row i = parity pattern for first digit value i (L=L-encoding, G=G-encoding)
var PARITY_TABLE = [
  'LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG',
  'LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'
];

// Indices (0-based) within the 95-bit data string where a guard bar has a '1' bit
var GUARD_ONES = {0:1, 2:1, 46:1, 48:1, 92:1, 94:1};

function renderBarcodeSVG(digits13) {
  var d = digits13.split('').map(Number);

  var mw      = 4;    // module width (px) — ≥3px for USB scanner readability
  var qz      = 11;   // quiet zone modules per side
  var barH    = 90;   // data bar height (px)
  var guardH  = 100;  // guard bar height (px) — extends 10px below data bars
  var topPad  = 5;
  var textH   = 20;
  var svgH    = topPad + guardH + textH + 5;
  var totalMods = 2 * qz + 95; // 117 modules
  var svgW    = totalMods * mw; // 468 px

  // Build 95-bit data string:
  //   start_guard(101) + left_group(6×7 L/G) + center_guard(01010) + right_group(6×7 R) + end_guard(101)
  var parity = PARITY_TABLE[d[0]];
  var bits = '101';
  for (var i = 0; i < 6; i++) {
    bits += (parity[i] === 'L' ? L_ENC : G_ENC)[d[i + 1]];
  }
  bits += '01010';
  for (var j = 0; j < 6; j++) {
    bits += R_ENC[d[j + 7]];
  }
  bits += '101';
  // bits.length === 95

  // Build SVG content
  var parts = [];

  // White background
  parts.push('<rect x="0" y="0" width="' + svgW + '" height="' + svgH + '" fill="white"/>');

  // Bars
  for (var k = 0; k < 95; k++) {
    if (bits[k] === '1') {
      var x = (qz + k) * mw;
      var h = GUARD_ONES[k] ? guardH : barH;
      parts.push('<rect x="' + x + '" y="' + topPad + '" width="' + mw + '" height="' + h + '" fill="black"/>');
    }
  }

  // Text elements
  var textY = topPad + guardH + 14;

  // First digit: right-aligned just before the start guard
  var firstDigitX = (qz - 1) * mw;
  parts.push(
    '<text x="' + firstDigitX + '" y="' + textY + '"' +
    ' text-anchor="end" font-family="monospace" font-size="11" fill="black">' +
    d[0] + '</text>'
  );

  // Left group (d[1]..d[6]): centered under modules qz+3 to qz+44
  // center module = qz+3 + 21 = qz+24
  var leftCX = (qz + 24) * mw;
  parts.push(
    '<text x="' + leftCX + '" y="' + textY + '"' +
    ' text-anchor="middle" font-family="monospace" font-size="11" fill="black">' +
    digits13.substring(1, 7) + '</text>'
  );

  // Right group (d[7]..d[12]): centered under modules qz+50 to qz+91
  // center module = qz+50 + 21 = qz+71
  var rightCX = (qz + 71) * mw;
  parts.push(
    '<text x="' + rightCX + '" y="' + textY + '"' +
    ' text-anchor="middle" font-family="monospace" font-size="11" fill="black">' +
    digits13.substring(7, 13) + '</text>'
  );

  return (
    '<svg xmlns="http://www.w3.org/2000/svg"' +
    ' viewBox="0 0 ' + svgW + ' ' + svgH + '"' +
    ' width="' + svgW + '" height="' + svgH + '"' +
    ' role="img" aria-label="Código de barras EAN-13: ' + digits13 + '">' +
    parts.join('') +
    '</svg>'
  );
}

// ─── Verificación interna del encoder (corre silenciosamente al cargar) ───────
(function selfTest() {
  var cases = [
    {plu:1,  cents:600000,  expected:'2000106000001'},
    {plu:2,  cents:1000000, expected:'2000210000003'},
    {plu:5,  cents:1753500, expected:'2000517535000'},
  ];
  for (var i = 0; i < cases.length; i++) {
    var c = cases[i];
    var got = buildEAN13(c.plu, c.cents);
    if (got !== c.expected) {
      console.error('KRETZ encoder self-test FAILED: PLU ' + c.plu +
        ' → esperado ' + c.expected + ', obtenido ' + got);
    }
  }
})();

// ─── Generar ──────────────────────────────────────────────────────────────────
function generate() {
  var errorMsg   = document.getElementById('errorMsg');
  var result     = document.getElementById('result');
  var btnImpimir = document.getElementById('btnImprimir');

  errorMsg.textContent = '';
  result.style.display = 'none';
  btnImpimir.style.display = 'none';

  if (!selectedProduct) {
    errorMsg.textContent = 'Seleccioná un producto.';
    return;
  }

  var raw    = document.getElementById('amountInput').value.trim().replace(',', '.');
  var amount = parseFloat(raw);

  if (!raw || isNaN(amount) || amount <= 0) {
    errorMsg.textContent = selectedProduct.unit === 'kg'
      ? 'Ingresá un peso válido (ej: 0,835).'
      : 'Ingresá una cantidad válida (ej: 1).';
    return;
  }

  var totalCents;
  if (selectedProduct.unit === 'kg') {
    // gramos × precio / 10 = centavos, sin perder precisión por float
    var grams = Math.round(amount * 1000);
    totalCents = Math.round(grams * selectedProduct.price / 10);
  } else {
    var qty = Math.round(amount);
    totalCents = qty * selectedProduct.price * 100;
  }

  if (totalCents > 9999999) {
    errorMsg.textContent =
      'El total supera el tope del formato ($99.999,99). Reducí el peso/cantidad.';
    return;
  }

  if (totalCents <= 0) {
    errorMsg.textContent = 'El total debe ser mayor a cero.';
    return;
  }

  var barcode = buildEAN13(selectedProduct.plu, totalCents);
  var svg     = renderBarcodeSVG(barcode);

  document.getElementById('barcodeContainer').innerHTML = svg;
  document.getElementById('barcodeDigits').textContent = barcode;

  // Reconstrucción que hará la app al escanear
  var recoStr;
  if (selectedProduct.unit === 'kg') {
    var pesoRec = (totalCents / 100 / selectedProduct.price).toFixed(3).replace('.', ',');
    recoStr = pesoRec + ' kg';
  } else {
    var cantRec = Math.round((totalCents / 100) / selectedProduct.price);
    recoStr = cantRec + (cantRec === 1 ? ' unidad' : ' unidades');
  }

  var totalARS = (totalCents / 100).toLocaleString('es-AR', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });

  document.getElementById('barcodeInfo').innerHTML =
    'PLU: ' + selectedProduct.plu +
    ' | Total: $' + totalARS +
    '<br>La app reconstruirá: ' + recoStr;

  result.style.display = 'block';
  btnImpimir.style.display = 'inline-block';
}

// Enter en el campo de cantidad también dispara la generación
document.getElementById('amountInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') generate();
});
</script>
</body>
</html>
